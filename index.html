<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Wortsalat</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Wortsalat">
<meta name="theme-color" content="#f5f5f5">
<script>
// Design vor dem ersten Zeichnen setzen (kein Aufblitzen): ws_theme = light | dark, fehlt = wie das Gerät
function applyTheme() {
  let t = null; try { t = localStorage.getItem('ws_theme'); } catch {}
  if (t) document.documentElement.dataset.theme = t; else delete document.documentElement.dataset.theme;
  const dark = t ? t === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches;
  document.querySelector('meta[name=theme-color]').content = dark ? '#121212' : '#f5f5f5';
}
applyTheme();
matchMedia('(prefers-color-scheme: dark)').addEventListener('change', applyTheme);
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;600;700;800&display=swap" rel="stylesheet">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-180.png">
<link rel="manifest" href="manifest.json">
<style>
:root {
  --bg: #f5f5f5; --card: #e9e9e9; --tile: #eaeaea; --line: #dcdcdc;
  --text: #1d3b40; --muted: #8a8a8a; --accent: #2e9d5b; --accent-2: #3daa6a; --accent-ink: #ffffff;
  --found-ink: #f4e88e; --danger: #c8302c;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #121212; --card: #1f1f1f; --tile: #262626; --line: #333333;
    --text: #f2f2f2; --muted: #9a9a9a;
  }
}
:root[data-theme="dark"] {
  --bg: #121212; --card: #1f1f1f; --tile: #262626; --line: #333333;
  --text: #f2f2f2; --muted: #9a9a9a;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; height: 100%; }
body {
  background: var(--bg); color: var(--text);
  font-family: "Montserrat", system-ui, -apple-system, sans-serif;
  -webkit-user-select: none; user-select: none; touch-action: manipulation;
  padding: env(safe-area-inset-top) 16px env(safe-area-inset-bottom);
  overflow-x: hidden;
}
.screen { display: none; max-width: 480px; margin: 0 auto; min-height: 100%; flex-direction: column; padding-bottom: 24px; }
.screen.active { display: flex; }
.bar { display: flex; align-items: center; gap: 8px; height: 56px; }
.bar h2 { flex: 1; margin: 0; font-size: 18px; font-weight: 600; text-align: center; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.icon-btn { width: 40px; height: 40px; border: 0; border-radius: 50%; background: var(--card); color: var(--text); font-size: 18px; cursor: pointer; }
.icon-btn:disabled { opacity: .4; }
button { font: inherit; }
.btn { border: 0; border-radius: 999px; padding: 14px 18px; font-size: 16px; font-weight: 700; background: var(--accent); color: var(--accent-ink); cursor: pointer; }
.btn.light { background: var(--card); color: var(--text); }
.btn:active, .icon-btn:active, .mode:active { opacity: .8; }

/* Menü */
.logo { margin: 28px 4px 18px; }
.logo h1 { margin: 0; font-size: 36px; font-weight: 800; color: var(--accent); }
.logo p { margin: 4px 0 0; color: var(--muted); font-weight: 500; }
.mode { display: flex; align-items: center; gap: 14px; width: 100%; text-align: left; border: 0; border-radius: 16px; padding: 14px 16px; margin-bottom: 10px; background: var(--card); color: var(--text); cursor: pointer; }
.mode .ico { font-size: 26px; width: 40px; text-align: center; }
.mode b { display: block; font-size: 17px; font-weight: 700; }
.mode span { color: var(--muted); font-size: 13px; font-weight: 500; }
.sizes { display: flex; gap: 8px; margin-top: 10px; }
.sizes button { flex: 1; border: 0; border-radius: 999px; padding: 7px 0; background: var(--accent); color: var(--accent-ink); font-weight: 700; cursor: pointer; }
.menu-foot { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: auto; padding-top: 12px; }
.menu-foot .btn[hidden] { display: none; }

/* Serie */
.streak { width: 100%; border: 0; border-radius: 20px; padding: 16px; margin-bottom: 14px; background: var(--card); color: var(--text); text-align: left; cursor: pointer; font: inherit; }
.streak-top { display: flex; align-items: center; gap: 12px; }
.flame { font-size: 44px; line-height: 1; filter: drop-shadow(0 2px 6px #ff8a0066); animation: flicker 1.8s infinite ease-in-out; }
.flame.off { filter: grayscale(1); opacity: .45; animation: none; }
@keyframes flicker { 50% { transform: scale(1.08) rotate(-3deg); } }
.streak-top b { display: block; font-size: 34px; font-weight: 800; line-height: 1; color: #f08a00; }
.streak-top .flame.off + div b { color: var(--muted); }
.streak-top span { color: var(--muted); font-weight: 600; font-size: 14px; }
.streak-top .best { margin-left: auto; text-align: right; font-size: 12px; }
.week { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; margin-top: 14px; text-align: center; }
.week i { font-style: normal; font-size: 11px; font-weight: 700; color: var(--muted); }
.week em { display: grid; place-items: center; width: 30px; height: 30px; margin: 4px auto 0; border-radius: 50%; background: var(--line); font-style: normal; font-size: 14px; font-weight: 800; color: #fff; }
.week .on em { background: #f08a00; }
.week .today em { box-shadow: 0 0 0 2px #f08a00 inset; }
.week .today i { color: #f08a00; }
.streak p { margin: 12px 0 0; font-size: 14px; font-weight: 600; color: var(--muted); }
.streak p.warn { color: #e0671b; }
.celebrate { display: flex; flex-direction: column; align-items: center; margin: 4px 0 6px; }
.celebrate .flame { font-size: 72px; }
.celebrate b { font-size: 56px; font-weight: 800; color: #f08a00; line-height: 1; animation: pop .6s .2s both; }
.celebrate span { color: var(--muted); font-weight: 700; }
@keyframes pop { 0% { transform: scale(.3); opacity: 0; } 70% { transform: scale(1.2); } 100% { transform: scale(1); opacity: 1; } }
@media (prefers-reduced-motion: reduce) { .flame, .celebrate b { animation: none; } }
.switch { display: flex; align-items: center; gap: 12px; padding: 12px 14px; background: var(--tile); margin-bottom: 4px; cursor: pointer; }
.switch div { flex: 1; font-weight: 700; } .switch small { display: block; color: var(--muted); font-weight: 500; margin-top: 2px; }
.switch input { width: 22px; height: 22px; accent-color: var(--accent); }

/* Haustiere */
.pet { position: fixed; left: 0; top: 0; width: 64px; height: 48px; pointer-events: none; z-index: 15; will-change: transform; }
.pet svg { width: 100%; height: 100%; overflow: visible; filter: drop-shadow(0 2px 1px #0002); }
.pet .leg, .pet .tail { transform-box: fill-box; }
.pet .leg { transform-origin: 50% 0; transition: transform .3s; }
.pet.walking .leg.a { animation: step .38s infinite alternate ease-in-out; }
.pet.walking .leg.b { animation: step .38s infinite alternate-reverse ease-in-out; }
@keyframes step { from { transform: rotate(24deg); } to { transform: rotate(-24deg); } }
.pet.walking svg { animation: bob .38s infinite alternate; }
@keyframes bob { to { transform: translateY(-1.5px); } }
.pet .tail { transform-origin: 100% 100%; animation: swish 1.6s infinite ease-in-out alternate; }
@keyframes swish { from { transform: rotate(-14deg); } to { transform: rotate(16deg); } }
.pet .closed { display: none; }
.pet.sleeping .eyes { display: none; }
.pet.sleeping .closed { display: inline; }
.pet.sleeping .leg { transform: scaleY(.35); }
.pet.sleeping svg { transform: translateY(5px); }
.pet.sleeping .tail { animation-duration: 4s; }
.pet .zzz { position: absolute; right: 0; top: -12px; font-weight: 800; color: var(--muted); opacity: 0; }
.pet.sleeping .zzz { animation: zzz 2.2s infinite; }
@keyframes zzz { 0% { opacity: 0; transform: translate(0, 0); } 30% { opacity: 1; } 100% { opacity: 0; transform: translate(8px, -16px); } }
@media (prefers-reduced-motion: reduce) { .pet * { animation: none !important; } }
.petgrid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.petcard { border: 0; border-radius: 16px; background: var(--card); color: var(--text); padding: 14px 10px; font: inherit; font-weight: 700; cursor: pointer; display: flex; flex-direction: column; align-items: center; gap: 6px; }
.petcard svg { width: 80px; height: 60px; }
.petcard .soon { font-size: 34px; height: 60px; display: grid; place-items: center; filter: grayscale(1); opacity: .5; }
.petcard small { color: var(--muted); font-weight: 500; }
.petcard.on { outline: 3px solid var(--accent); }
.petcard:disabled { cursor: default; }

/* Rangliste & Admin */
.tabs { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 6px; margin-bottom: 8px; }
.tabs button { flex: none; border: 0; border-radius: 999px; padding: 7px 14px; background: var(--card); color: var(--text); font-weight: 600; cursor: pointer; }
.tabs button.on { background: var(--accent); color: var(--accent-ink); }
.rank { display: flex; align-items: center; gap: 12px; padding: 12px 14px; background: var(--tile); margin-bottom: 4px; font-weight: 600; }
.rank .pos { width: 28px; color: var(--muted); }
.rank .name { flex: 1; overflow: hidden; text-overflow: ellipsis; }
.rank .val { font-weight: 800; }
.rank.me { background: var(--accent); color: var(--accent-ink); }
.rank.me .pos { color: inherit; }
.urow { width: 100%; text-align: left; border: 0; display: block; padding: 12px 14px; background: var(--tile); color: var(--text); margin-bottom: 4px; cursor: pointer; font: inherit; }
.urow b { font-size: 16px; } .urow small { display: block; color: var(--muted); margin-top: 3px; }
.badge { display: inline-block; font-size: 11px; font-weight: 700; padding: 2px 8px; border-radius: 999px; background: var(--accent); color: var(--accent-ink); margin-left: 6px; vertical-align: middle; }
.badge.red { background: var(--danger); }
.edit { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; text-align: left; }
.edit label { font-size: 12px; color: var(--muted); font-weight: 600; display: flex; flex-direction: column; gap: 3px; }
.edit label.full { grid-column: 1 / -1; }
.edit label.check { flex-direction: row; align-items: center; gap: 8px; color: var(--text); font-size: 15px; }
.edit input[type=text], .edit input[type=number] { font: inherit; font-size: 16px; padding: 8px; border-radius: 8px; border: 1px solid var(--line); background: var(--bg); color: var(--text); -webkit-user-select: text; user-select: text; width: 100%; }

/* Spiel */
.logo-btn { width: 40px; height: 40px; border: 0; padding: 0; border-radius: 50%; overflow: hidden; background: var(--card); cursor: pointer; }
.logo-btn img { width: 100%; height: 100%; display: block; }
#clock { color: var(--muted); font-variant-numeric: tabular-nums; }
.task { margin: 10px 4px 2px; }
.task b { display: block; color: var(--accent); font-size: 20px; font-weight: 700; }
.task span { color: var(--muted); font-size: 15px; font-weight: 500; }
.howto { color: var(--accent); font-weight: 600; margin: 20px 4px 0; }
.howto:empty { display: none; }
.logo button { border: 0; background: none; padding: 0; margin-top: 8px; color: var(--accent); font-weight: 600; text-decoration: underline; cursor: pointer; }
.preview { height: 44px; display: flex; justify-content: center; align-items: center; }
.preview span { background: var(--accent); color: var(--accent-ink); padding: 6px 16px; border-radius: 999px; font-size: 20px; font-weight: 800; letter-spacing: 2px; }
.preview span:empty { display: none; }
.preview span.bad { background: var(--danger); color: #fff; }
.board-wrap { position: relative; width: min(100%, 440px); aspect-ratio: 1; margin: 0 auto; touch-action: none; }
.board { position: relative; z-index: 0; width: 100%; height: 100%; display: grid; grid-template-columns: repeat(var(--n), 1fr); gap: 4px; }
.board svg { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 1; }
.cell { display: flex; align-items: center; justify-content: center; background: var(--tile); font-weight: 700; font-size: calc(min(92vw, 440px) / var(--n) * .45); color: var(--text); }
.cell span { position: relative; z-index: 2; }
.cell.sel { color: var(--found-ink); }
.cell.gone { background: transparent; }
.cell.vanish { background: var(--tile); animation: vanish .4s forwards; }
@keyframes vanish { to { transform: scale(.2); opacity: 0; } }
.cell.hint { outline: 3px solid var(--accent); outline-offset: -3px; animation: pulse 1.2s infinite; }
@keyframes pulse { 50% { outline-color: transparent; } }
.shake { animation: shake .35s; }
@keyframes shake { 20%, 60% { transform: translateX(-8px); } 40%, 80% { transform: translateX(8px); } }
.words { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 18px; }
.chip { min-width: 72px; text-align: center; padding: 5px 14px; border-radius: 999px; background: var(--card); font-size: 13px; font-weight: 600; color: var(--text); }
.chip.found { background: var(--accent); color: var(--accent-ink); font-weight: 700; }
.toast { position: fixed; left: 50%; top: calc(env(safe-area-inset-top) + 70px); transform: translateX(-50%); background: var(--text); color: var(--bg); padding: 8px 16px; border-radius: 999px; font-weight: 600; opacity: 0; transition: opacity .2s; pointer-events: none; z-index: 20; }
.toast.show { opacity: 1; }

/* Dialog */
dialog { border: 0; border-radius: 20px; padding: 24px; width: min(90vw, 360px); background: var(--bg); color: var(--text); text-align: center; }
dialog::backdrop { background: #0008; }
dialog h3 { margin: 0 0 8px; font-size: 24px; color: var(--accent); }
dialog .actions { display: flex; flex-direction: column; gap: 10px; margin-top: 18px; }

/* Statistik */
.tiles { display: grid; grid-template-columns: repeat(3, 1fr); gap: 4px; }
.tile { background: var(--tile); padding: 14px 6px; text-align: center; }
.tile b { display: block; font-size: 26px; font-weight: 800; }
.tile span { font-size: 12px; color: var(--muted); font-weight: 500; }
h3.sec { margin: 22px 4px 10px; font-size: 16px; }
.barrow { display: flex; align-items: center; gap: 10px; margin: 8px 4px; font-weight: 500; }
.barrow span:first-child { width: 90px; }
.barrow .track { flex: 1; height: 20px; background: var(--card); border-radius: 999px; overflow: hidden; }
.barrow .fill { height: 100%; background: var(--accent); border-radius: 999px; min-width: 4px; }
.barrow b { width: 36px; text-align: right; }

/* Konto */
.form { background: var(--card); border-radius: 16px; padding: 18px; display: flex; flex-direction: column; gap: 12px; }
.form input { font: inherit; font-size: 16px; padding: 12px; border-radius: 10px; border: 1px solid var(--line); background: var(--bg); color: var(--text); -webkit-user-select: text; user-select: text; }
.form .row { display: flex; gap: 10px; } .form .row .btn { flex: 1; }
.msg { color: var(--muted); min-height: 1.2em; margin: 0; }
.msg.err { color: var(--danger); }
.msg.ok { color: var(--accent); }
.form + .form { margin-top: 12px; }
.link { border: 0; background: none; padding: 0; color: var(--accent); font: inherit; font-weight: 600; text-decoration: underline; cursor: pointer; align-self: flex-start; }
.dlg-in { width: 100%; font: inherit; font-size: 16px; padding: 10px; margin-top: 8px; border-radius: 10px; border: 1px solid var(--line); background: var(--card); color: var(--text); -webkit-user-select: text; user-select: text; }
</style>
</head>
<body>

<section id="menu" class="screen active">
  <div class="logo"><h1>Wortsalat</h1><p>Finde die Wörter im Buchstabensalat</p><button data-start="tutorial">So geht's</button></div>
  <button class="streak" data-start="tag">
    <div class="streak-top"><span class="flame" id="flame">🔥</span><div><b id="streakNum">0</b><span>Tage Serie</span></div><span class="best" id="streakBest"></span></div>
    <div class="week" id="week"></div>
    <p id="streakMsg"></p>
  </button>
  <button class="mode" data-start="tag"><span class="ico">📅</span><div><b>Tagesrätsel</b><span id="dailyInfo"></span></div></button>
  <div class="mode" style="display:block;cursor:default">
    <div style="display:flex;gap:14px;align-items:center"><span class="ico">🎲</span><div><b>Freies Spiel</b><span>Größe wählen</span></div></div>
    <div class="sizes"><button data-size="4">4×4</button><button data-size="5">5×5</button><button data-size="6">6×6</button></div>
  </div>
  <div class="mode" style="display:block;cursor:default">
    <div style="display:flex;gap:14px;align-items:center"><span class="ico">⏱️</span><div><b>Zeitmodus</b><span id="timedInfo"></span></div></div>
    <div class="sizes"><button data-zeit="4">4×4</button><button data-zeit="5">5×5</button><button data-zeit="6">6×6</button></div>
  </div>
  <button class="mode" data-start="level"><span class="ico">🏆</span><div><b>Level-Modus</b><span id="levelInfo"></span></div></button>
  <div class="menu-foot">
    <button class="btn light" data-go="stats">📊 Statistik</button>
    <button class="btn light" data-go="account" id="accountBtn">👤 Konto</button>
    <button class="btn light" data-go="ranking">🏅 Rangliste</button>
    <button class="btn light" data-go="pets">🐾 Haustier</button>
    <button class="btn light" data-go="notify">🔔 Mitteilungen</button>
    <button class="btn light" id="themeBtn">🌓 Design</button>
    <button class="btn light" data-go="admin" id="adminBtn" hidden>🛠️ Admin</button>
  </div>
</section>

<section id="game" class="screen">
  <div class="bar">
    <button class="logo-btn" id="back" aria-label="Zurück zum Menü"><img src="icon-180.png" alt=""></button>
    <h2 id="clock">00:00</h2>
    <button class="icon-btn" id="hint" aria-label="Hinweis">💡</button>
  </div>
  <div class="task"><b id="theme"></b><span id="sub"></span></div>
  <div class="preview"><span id="preview"></span></div>
  <div class="board-wrap" id="boardWrap"><div class="board" id="board"></div></div>
  <div class="words" id="words"></div>
  <p class="howto" id="howto"></p>
  <button class="btn light" id="newGame" style="margin-top:20px" hidden>🔀 Neues Rätsel</button>
</section>

<section id="stats" class="screen">
  <div class="bar"><button class="icon-btn" data-go="menu" aria-label="Zurück">←</button><h2>Statistik</h2><span style="width:44px"></span></div>
  <div id="statsBody"></div>
</section>

<section id="account" class="screen">
  <div class="bar"><button class="icon-btn" data-go="menu" aria-label="Zurück">←</button><h2>Konto</h2><span style="width:44px"></span></div>
  <div id="accountBody"></div>
</section>

<section id="ranking" class="screen">
  <div class="bar"><button class="icon-btn" data-go="menu" aria-label="Zurück">←</button><h2>Rangliste</h2><button class="icon-btn" id="rankReload" aria-label="Neu laden">↻</button></div>
  <div class="tabs" id="rankTabs"></div>
  <div id="rankBody"></div>
</section>

<section id="pets" class="screen">
  <div class="bar"><button class="icon-btn" data-go="menu" aria-label="Zurück">←</button><h2>Haustier</h2><span style="width:44px"></span></div>
  <p class="msg" style="margin:0 4px 12px">Dein Haustier läuft über Startbildschirm und Spielfeld. Es stört beim Wischen nicht.</p>
  <div class="petgrid" id="petGrid"></div>
</section>

<section id="notify" class="screen">
  <div class="bar"><button class="icon-btn" data-go="menu" aria-label="Zurück">←</button><h2>Mitteilungen</h2><span style="width:44px"></span></div>
  <div id="notifyBody"></div>
</section>

<section id="admin" class="screen">
  <div class="bar"><button class="icon-btn" data-go="menu" aria-label="Zurück">←</button><h2>Admin</h2><button class="icon-btn" id="adminReload" aria-label="Neu laden">↻</button></div>
  <div id="adminBody"></div>
</section>

<dialog id="dlg"><h3 id="dlgTitle"></h3><div id="dlgBody"></div><div class="actions" id="dlgActions"></div></dialog>
<div class="toast" id="toast"></div>

<script type="module">
import { dailyPuzzle, levelPuzzle, randomPuzzle, tutorialPuzzle, neighbors, today } from './game.js';
import * as db from './db.js';
import { PETS, showPet } from './pets.js';
import { KINDS, MILESTONES } from './push/rules.mjs';
import { VAPID_PUBLIC } from './config.js';

const $ = id => document.getElementById(id);
const TIME_LIMIT = 90;
let g = null; // aktuelles Spiel
let timer = null;

// ---------- Navigation ----------
function show(id) {
  document.querySelectorAll('.screen').forEach(s => s.classList.toggle('active', s.id === id));
  if (id === 'menu') renderMenu();
  if (id === 'stats') renderStats();
  if (id === 'account') renderAccount();
  if (id === 'ranking') renderRanking();
  if (id === 'admin') renderAdmin();
  if (id === 'pets') renderPets();
  if (id === 'notify') renderNotify();
}
document.querySelectorAll('[data-go]').forEach(b => b.onclick = () => show(b.dataset.go));
document.querySelectorAll('[data-start]').forEach(b => b.onclick = () => start(b.dataset.start));
document.querySelectorAll('[data-size]').forEach(b => b.onclick = () => start('frei', +b.dataset.size));
document.querySelectorAll('[data-zeit]').forEach(b => b.onclick = () => start('zeit', +b.dataset.zeit));
$('back').onclick = () => { persist(); stopTimer(); show('menu'); };
$('newGame').onclick = () => {
  if (Object.keys(g.found).length && !confirm('Dieses Rätsel verwerfen und ein neues Thema starten?')) return;
  start('frei', g.puzzle.size, true, g.puzzle.title);
};

function toast(text) {
  const t = $('toast'); t.textContent = text; t.classList.add('show');
  clearTimeout(t._h); t._h = setTimeout(() => t.classList.remove('show'), 1400);
}

function dialog(title, html, actions) {
  $('dlgTitle').textContent = title;
  $('dlgBody').innerHTML = html;
  $('dlgActions').replaceChildren(...actions.map(([label, fn, light]) => {
    const b = document.createElement('button');
    b.className = 'btn' + (light ? ' light' : ''); b.textContent = label;
    b.onclick = () => { $('dlg').close(); fn(); };
    return b;
  }));
  $('dlg').showModal();
}

function streakNow(p, ref = today()) {
  const y = new Date(ref + 'T12:00'); y.setDate(y.getDate() - 1);
  return p.last_daily === ref || p.last_daily === y.toLocaleDateString('sv') ? p.daily_streak : 0;
}

const addDays = (d, n) => { const x = new Date(d + 'T12:00'); x.setDate(x.getDate() + n); return x.toLocaleDateString('sv'); };
const nextMilestone = s => MILESTONES.find(m => m > s) ?? s + 100;

// Wochenleiste Mo–So: Tage der aktuellen Serie sind orange
function weekHtml(p = db.progress()) {
  const t = today(), s = streakNow(p);
  const from = s ? addDays(p.last_daily, 1 - s) : null;
  const monday = addDays(t, -((new Date(t + 'T12:00').getDay() + 6) % 7));
  return '<div class="week">' + ['Mo', 'Di', 'Mi', 'Do', 'Fr', 'Sa', 'So'].map((name, i) => {
    const d = addDays(monday, i), on = s && d >= from && d <= p.last_daily;
    return `<div class="${on ? 'on' : ''} ${d === t ? 'today' : ''}"><i>${name}</i><em>${on ? '✓' : ''}</em></div>`;
  }).join('') + '</div>';
}

function renderStreak() {
  const p = db.progress(), s = streakNow(p), done = p.last_daily === today();
  $('flame').classList.toggle('off', !done);
  $('streakNum').textContent = s;
  $('streakBest').innerHTML = `Rekord<br><b style="font-size:18px;color:var(--text)">${Math.max(p.best_streak, s)}</b>`;
  $('week').outerHTML = weekHtml(p).replace('class="week"', 'class="week" id="week"');
  const msg = $('streakMsg'), hoursLeft = 24 - new Date().getHours();
  msg.className = !done && s ? 'warn' : '';
  msg.textContent = done ? `Heute geschafft! Nächstes Ziel: ${nextMilestone(s)} Tage 🏁`
    : s ? `Noch ${hoursLeft} Std. – löse das Tagesrätsel, sonst ist deine Serie weg!`
    : 'Löse das Tagesrätsel und starte eine neue Serie!';
  if (done) navigator.clearAppBadge?.().catch(() => {});
}

function renderMenu() {
  const p = db.progress();
  const done = db.dailyState(today())?.done;
  renderStreak();
  $('dailyInfo').textContent = done ? '✓ Heute geschafft' : 'Neues Rätsel wartet';
  $('timedInfo').textContent = `${TIME_LIMIT} Sekunden · Rekord ${p.timed_highscore}`;
  $('levelInfo').textContent = `Weiter mit Level ${p.current_level}`;
  const u = db.getUser();
  const prof = db.getProfile();
  $('accountBtn').textContent = u ? '👤 ' + (prof?.username ?? u.email.split('@')[0]) : '👤 Anmelden';
  $('adminBtn').hidden = !prof?.is_admin;
}

// ---------- Spielstart ----------
// fresh: angefangenes Rätsel verwerfen und ein neues Thema nehmen (avoid = bisheriges Thema)
function start(mode, size, fresh, avoid) {
  stopTimer();
  const p = db.progress();
  const key = mode === 'frei' ? 'frei' + size : mode === 'level' ? 'level' : null;
  let saved = key && !fresh ? db.savedGame(key) : null;
  if (mode === 'level' && saved?.level !== p.current_level) saved = null;
  let puzzle;
  if (mode === 'tag') puzzle = dailyPuzzle();
  else if (mode === 'level') puzzle = levelPuzzle(p.current_level);
  else if (mode === 'tutorial') puzzle = tutorialPuzzle();
  else if (mode === 'frei') puzzle = saved?.puzzle ?? randomPuzzle(size, avoid);
  else puzzle = randomPuzzle(size || 5);
  g = { mode, key, puzzle, found: {}, hints: [], startedAt: Date.now(), score: 0, wordsTotal: 0, level: p.current_level, date: today() };
  if (saved) Object.assign(g, { found: saved.found, hints: saved.hints, startedAt: Date.now() - saved.elapsed });
  if (key && fresh) db.saveGame(key, null);
  if (mode === 'tag') {
    const s = db.dailyState(today());
    if (s) Object.assign(g, { found: s.found, hints: s.hints, startedAt: s.startedAt ?? g.startedAt });
  }
  if (mode === 'zeit') g.endsAt = Date.now() + TIME_LIMIT * 1000;
  timer = setInterval(tick, 250);
  $('newGame').hidden = mode !== 'frei';
  show('game');
  draw();
  tick();
  if (mode === 'tag' && db.dailyState(today())?.done) stopTimer(), $('clock').textContent = '✓', dialog('Schon gelöst!', '<p>Morgen gibt es ein neues Tagesrätsel.</p>', [['OK', () => {}]]);
}

function stopTimer() { clearInterval(timer); timer = null; }

// Angefangenes Freies Spiel / Level merken, damit es beim nächsten Öffnen weitergeht
function persist() {
  if (!g?.key || g.done) return;
  db.saveGame(g.key, { puzzle: g.puzzle, level: g.level, found: g.found, hints: g.hints, elapsed: Date.now() - g.startedAt });
}
document.addEventListener('visibilitychange', () => { if (document.hidden) persist(); });

const clock = s => `${String(Math.floor(s / 60)).padStart(2, '0')}:${String(s % 60).padStart(2, '0')}`;
function tick() {
  if (g.mode !== 'zeit') { $('clock').textContent = clock(Math.floor((Date.now() - g.startedAt) / 1000)); return; }
  const left = Math.max(0, Math.ceil((g.endsAt - Date.now()) / 1000));
  $('clock').textContent = clock(left);
  if (left === 0) timeUp();
}

// ---------- Zeichnen ----------
function draw() {
  const { puzzle, mode } = g;
  const n = puzzle.size;
  $('theme').textContent = mode === 'tutorial' ? `Finde die ${puzzle.words.length} versteckten Obstsorten` : puzzle.title;
  const foundCount = Object.keys(g.found).length;
  const first = puzzle.words.reduce((a, b) => (b.word.length < a.word.length ? b : a)).word;
  $('sub').textContent = {
    tutorial: foundCount ? 'Super! Ein Buchstabe verschwindet, sobald kein Wort ihn mehr braucht.' : `Fang mit „${first[0] + first.slice(1).toLowerCase()}“ an`,
    tag: `Tagesrätsel · ${g.date.split('-').reverse().join('.')}`,
    level: `Level ${g.level}`,
    zeit: `Zeitmodus · ${g.score} Punkte`,
    frei: `Freies Spiel · ${n}×${n}`,
  }[mode];
  $('howto').textContent = mode === 'tutorial' ? 'Verbinde benachbarte Buchstaben zu Wörtern – auch schräg.' : '';

  const board = $('board');
  board.style.setProperty('--n', n);
  // Jede Zelle bleibt, solange noch ein ungefundenes Wort über sie läuft
  const left = new Array(n * n).fill(0);
  puzzle.words.forEach((w, i) => { if (!g.found[i]) w.path.forEach(c => left[c]++); });
  const prev = g.left; g.left = left;
  const hintCells = new Set(g.hints.filter(i => !g.found[i]).map(i => puzzle.words[i].path[0]));
  board.innerHTML = puzzle.grid.map((ch, i) =>
    left[i] ? `<div class="cell${hintCells.has(i) ? ' hint' : ''}"><span>${ch}</span></div>`
      : `<div class="cell gone${prev?.[i] ? ' vanish' : ''}"><span>${prev?.[i] ? ch : ''}</span></div>`).join('')
    + '<svg id="lines" viewBox="0 0 100 100" preserveAspectRatio="none"></svg>';
  drawLines();

  $('words').innerHTML = alphaOrder().map(i => { const w = puzzle.words[i]; return g.found[i]
    ? `<span class="chip found">${w.word}</span>`
    : `<span class="chip">${g.hints.includes(i) ? w.word[0] + ' · ' : ''}${w.word.length}</span>`; }).join('');
  $('hint').disabled = foundCount === puzzle.words.length || puzzle.words.every((_, i) => g.found[i] || g.hints.includes(i));
}

// Lösungswörter alphabetisch (deutsch, Umlaute richtig einsortiert); liefert die Wort-Indizes
const alphaOrder = () => g.puzzle.words.map((_, i) => i).sort((a, b) => g.puzzle.words[a].word.localeCompare(g.puzzle.words[b].word, 'de'));

const center = (i, n) => [((i % n) + 0.5) * 100 / n, (Math.floor(i / n) + 0.5) * 100 / n];

function drawLines(sel = []) {
  const n = g.puzzle.size;
  const line = (path, color, op) => `<polyline points="${path.map(i => center(i, n).join(',')).join(' ')}" fill="none" stroke="${color}" stroke-opacity="${op}" stroke-width="${60 / n}" stroke-linecap="round" stroke-linejoin="round"/>`;
  $('lines').innerHTML = sel.length > 1 ? line(sel, 'var(--accent)', 1) : '';
}

// ---------- Wischen ----------
let sel = null;
function cellAt(x, y) {
  const r = $('board').getBoundingClientRect(), n = g.puzzle.size, cw = r.width / n;
  const col = Math.floor((x - r.left) / cw), row = Math.floor((y - r.top) / cw);
  if (col < 0 || row < 0 || col >= n || row >= n) return null;
  const [cx, cy] = [r.left + (col + .5) * cw, r.top + (row + .5) * cw];
  return Math.hypot(x - cx, y - cy) < cw * 0.42 ? row * n + col : null; // Ecken frei lassen → Diagonalen leichter
}
function updateSel() {
  document.querySelectorAll('.cell.sel').forEach(c => c.classList.remove('sel'));
  sel.forEach(i => $('board').children[i].classList.add('sel'));
  const p = $('preview'); p.className = ''; p.textContent = sel.map(i => g.puzzle.grid[i]).join('');
  drawLines(sel);
}
const wrap = $('boardWrap');
wrap.addEventListener('pointerdown', e => {
  if (!g || $('dlg').open) return;
  const c = cellAt(e.clientX, e.clientY);
  if (c === null || !g.left[c]) return;
  wrap.setPointerCapture(e.pointerId);
  sel = [c]; updateSel();
});
wrap.addEventListener('pointermove', e => {
  if (!sel) return;
  const c = cellAt(e.clientX, e.clientY);
  if (c === null || !g.left[c] || c === sel.at(-1)) return;
  if (c === sel.at(-2)) sel.pop();
  else if (!sel.includes(c) && neighbors(sel.at(-1), g.puzzle.size).includes(c)) sel.push(c);
  else return;
  updateSel();
});
const endSel = () => {
  if (!sel) return;
  const path = sel; sel = null;
  submit(path);
};
wrap.addEventListener('pointerup', endSel);
wrap.addEventListener('pointercancel', endSel);

function submit(path) {
  const word = path.map(i => g.puzzle.grid[i]).join('');
  const idx = g.puzzle.words.findIndex((w, i) => w.word === word && !g.found[i]);
  const p = $('preview');
  if (idx >= 0) {
    g.found[idx] = 1;
    g.score += word.length;
    p.textContent = '';
    draw();
    if (g.mode === 'tag') db.setDailyState(g.date, { found: g.found, hints: g.hints, startedAt: g.startedAt, done: false });
    persist();
    if (Object.keys(g.found).length === g.puzzle.words.length) setTimeout(solved, 350);
    return;
  }
  drawLines();
  document.querySelectorAll('.cell.sel').forEach(c => c.classList.remove('sel'));
  if (path.length < 2) { p.textContent = ''; return; }
  if (g.puzzle.words.some(w => w.word === word)) toast('Schon gefunden');
  p.className = 'bad';
  wrap.classList.remove('shake'); void wrap.offsetWidth; wrap.classList.add('shake');
  setTimeout(() => { if (!sel) { p.textContent = ''; p.className = ''; } }, 500);
}

$('hint').onclick = () => {
  const i = alphaOrder().find(i => !g.found[i] && !g.hints.includes(i));
  if (i === undefined) return;
  g.hints.push(i);
  if (g.mode === 'tag') db.setDailyState(g.date, { found: g.found, hints: g.hints, startedAt: g.startedAt, done: false });
  persist();
  draw();
};

// ---------- Ende ----------
function record(extra) {
  db.recordGame({
    mode: g.mode, size: g.puzzle.size, level: g.mode === 'level' ? g.level : null,
    words_found: Object.keys(g.found).length, words_total: g.puzzle.words.length,
    hints: g.hints.length, seconds: Math.round((Date.now() - g.startedAt) / 1000), won: true, ...extra,
  });
}

function solved() {
  const secs = Math.round((Date.now() - g.startedAt) / 1000);
  const time = `${Math.floor(secs / 60)}:${String(secs % 60).padStart(2, '0')}`;
  if (g.mode === 'tutorial') {
    stopTimer();
    dialog('Tutorial geschafft!', '<p>Jetzt kennst du alles. Viel Spaß beim Wortsalat!</p>', [["Los geht's", () => show('menu')]]);
    return;
  }
  if (g.mode !== 'zeit') stopTimer();
  if (g.mode === 'zeit') {
    g.wordsTotal += g.puzzle.words.length;
    g.foundTotal = (g.foundTotal ?? 0) + g.puzzle.words.length;
    g.hintsTotal = (g.hintsTotal ?? 0) + g.hints.length;
    g.puzzle = randomPuzzle(g.puzzle.size); g.found = {}; g.hints = []; g.left = null;
    toast('Neues Gitter!');
    draw();
    return;
  }
  record();
  if (g.key) { g.done = true; db.saveGame(g.key, null); }
  if (g.mode === 'tag') {
    db.setDailyState(g.date, { found: g.found, hints: g.hints, startedAt: g.startedAt, done: true });
    const p = db.progress();
    if (p.last_daily !== g.date) {
      const streak = streakNow(p, g.date) + 1;
      db.setProgress({ daily_streak: streak, best_streak: Math.max(p.best_streak, streak), last_daily: g.date });
    }
    const s = db.progress().daily_streak, big = MILESTONES.includes(s);
    const askPush = db.getUser() && 'PushManager' in window && Notification.permission === 'default';
    dialog(big ? `${s} Tage! 🎉` : s > 1 ? 'Serie verlängert!' : 'Serie gestartet!',
      `<div class="celebrate"><span class="flame">🔥</span><b>${s}</b><span>${s === 1 ? 'Tag' : 'Tage'} Serie</span></div>${weekHtml()}
       <p>${big ? `Wahnsinn – ${s} Tage am Stück!` : `Noch ${nextMilestone(s) - s} bis zum Ziel von ${nextMilestone(s)} Tagen.`}<br><small style="color:var(--muted)">Zeit ${time} · Hinweise ${g.hints.length}</small></p>`,
      [['Weiter', () => show('menu')], ...(askPush ? [['🔔 Morgen erinnern', () => show('notify'), true]] : [])]);
    navigator.clearAppBadge?.().catch(() => {});
  } else if (g.mode === 'level') {
    db.setProgress({ current_level: Math.max(db.progress().current_level, g.level + 1) });
    dialog(`Level ${g.level} geschafft!`, `<p>Zeit ${time} · Hinweise ${g.hints.length}</p>`,
      [[`Weiter zu Level ${g.level + 1}`, () => start('level')], ['Menü', () => show('menu'), true]]);
  } else {
    const n = g.puzzle.size;
    dialog('Geschafft!', `<p>Zeit ${time} · Hinweise ${g.hints.length}</p>`,
      [['Neues Rätsel', () => start('frei', n, true, g.puzzle.title)], ['Menü', () => show('menu'), true]]);
  }
}

function timeUp() {
  stopTimer();
  const found = (g.foundTotal ?? 0) + Object.keys(g.found).length;
  const n = g.puzzle.size;
  // Rekord je Größe aus dem Spielverlauf; timed_highscore bleibt der Gesamtrekord für die Rangliste
  const sizeBest = Math.max(0, ...db.games().filter(x => x.mode === 'zeit' && x.size === n).map(x => x.score));
  record({ size: n, words_found: found, words_total: g.wordsTotal + g.puzzle.words.length, score: g.score,
           hints: (g.hintsTotal ?? 0) + g.hints.length, seconds: TIME_LIMIT, won: false });
  const p = db.progress();
  const best = g.score > p.timed_highscore;
  if (best) db.setProgress({ timed_highscore: g.score });
  const line = best ? '🎉 Neuer Gesamtrekord!' : g.score > sizeBest ? `🎉 Neuer Rekord für ${n}×${n}!` : `Rekord ${n}×${n}: ${sizeBest} · Gesamt: ${p.timed_highscore}`;
  dialog('Zeit um! ⏱️', `<p><b style="font-size:40px">${g.score}</b> Punkte<br>${found} Wörter · ${n}×${n}<br>${line}</p>`,
    [['Nochmal', () => start('zeit', n)], ['Menü', () => show('menu'), true]]);
}

// ---------- Statistik ----------
function renderStats() {
  const games = db.games(), p = db.progress();
  const by = m => games.filter(x => x.mode === m);
  const words = games.reduce((s, x) => s + x.words_found, 0);
  const hints = games.reduce((s, x) => s + x.hints, 0);
  const modes = [['tag', 'Tagesrätsel'], ['frei', 'Frei'], ['zeit', 'Zeitmodus'], ['level', 'Level']];
  const max = Math.max(1, ...modes.map(([m]) => by(m).length));
  const sizes = [4, 5, 6].map(s => [s, by('frei').filter(x => x.size === s).length]);
  const tile = (v, l) => `<div class="tile"><b>${v}</b><span>${l}</span></div>`;
  const bar = (label, v, m) => `<div class="barrow"><span>${label}</span><div class="track"><div class="fill" style="width:${v / m * 100}%"></div></div><b>${v}</b></div>`;
  $('statsBody').innerHTML = `
    <div class="tiles">
      ${tile(games.length, 'Gespielt')}${tile(words, 'Wörter')}${tile(hints, 'Hinweise')}
      ${tile(streakNow(p), 'Serie 🔥')}${tile(p.best_streak, 'Beste Serie')}${tile(by('tag').length, 'Tagesrätsel')}
      ${tile(p.current_level, 'Level')}${tile(p.timed_highscore, 'Zeit-Rekord')}${tile(by('frei').length, 'Freie Spiele')}
    </div>
    <h3 class="sec">Nach Modus</h3>${modes.map(([m, l]) => bar(l, by(m).length, max)).join('')}
    <h3 class="sec">Freies Spiel nach Größe</h3>${sizes.map(([s, v]) => bar(`${s}×${s}`, v, Math.max(1, ...sizes.map(x => x[1])))).join('')}
    <p class="msg" style="margin-top:18px;text-align:center">${db.getUser() ? 'Mit deinem Konto synchronisiert.' : 'Nur auf diesem Gerät gespeichert – melde dich an, um zu synchronisieren.'}</p>`;
}

// ---------- Konto ----------
function renderAccount() {
  const body = $('accountBody');
  if (!db.online) {
    body.innerHTML = `<div class="form"><b>Online-Konto noch nicht eingerichtet</b><p class="msg">Supabase-Daten in config.js eintragen. Bis dahin wird alles auf diesem Gerät gespeichert.</p></div>`;
    return;
  }
  const u = db.getUser();
  if (u) {
    const prof = db.getProfile();
    body.innerHTML = `<div class="form"><b>Angemeldet als</b><span>${esc(prof?.username ?? u.email)}${prof?.is_admin ? '<span class="badge">Admin</span>' : ''}</span>
      ${prof?.banned ? '<p class="msg err">Dein Konto ist gesperrt. Neue Ergebnisse werden nicht gespeichert.</p>' : '<p class="msg">Fortschritt und Statistik werden automatisch synchronisiert.</p>'}
      <button class="btn light" id="logout">Abmelden</button></div>
      <form class="form" id="nameForm"><b>Benutzername ändern</b>
        <input id="newName" type="text" value="${esc(prof?.username ?? '')}" autocomplete="username" autocapitalize="none" autocorrect="off" spellcheck="false" required>
        <button class="btn light">Namen speichern</button><p class="msg" id="nameMsg"></p></form>
      <form class="form" id="pwForm"><b>Passwort ändern</b>
        <input id="pwOld" type="password" placeholder="Aktuelles Passwort" autocomplete="current-password" required>
        <input id="pwNew" type="password" placeholder="Neues Passwort (mind. 6 Zeichen)" autocomplete="new-password" minlength="6" required>
        <input id="pwNew2" type="password" placeholder="Neues Passwort wiederholen" autocomplete="new-password" minlength="6" required>
        <button class="btn light">Passwort ändern</button><p class="msg" id="pwMsg"></p>
        <button type="button" class="link" id="forgot">Aktuelles Passwort vergessen?</button></form>`;
    $('logout').onclick = async () => { await db.signOut(); renderAccount(); renderMenu(); };
    const busy = async (msgId, fn, okText) => {
      const m = $(msgId); m.className = 'msg'; m.textContent = 'Einen Moment…';
      try { await fn(); m.className = 'msg ok'; m.textContent = okText; return true; }
      catch (err) { m.className = 'msg err'; m.textContent = err.message; return false; }
    };
    $('nameForm').onsubmit = async e => {
      e.preventDefault();
      if (await busy('nameMsg', () => db.changeUsername($('newName').value), 'Gespeichert. Melde dich ab jetzt mit dem neuen Namen an.')) renderMenu();
    };
    $('pwForm').onsubmit = async e => {
      e.preventDefault();
      if (await busy('pwMsg', () => {
        if ($('pwNew').value !== $('pwNew2').value) throw new Error('Die neuen Passwörter stimmen nicht überein.');
        return db.changePassword($('pwOld').value, $('pwNew').value);
      }, 'Passwort geändert.')) $('pwForm').querySelectorAll('input').forEach(i => i.value = '');
    };
    $('forgot').onclick = () => forgotPassword(prof?.username);
    return;
  }
  body.innerHTML = `<form class="form" id="loginForm">
      <b>Anmelden oder Konto erstellen</b>
      <input id="email" type="text" placeholder="Benutzername" autocomplete="username" autocapitalize="none" autocorrect="off" spellcheck="false" required>
      <input id="pw" type="password" placeholder="Passwort (mind. 6 Zeichen)" autocomplete="current-password" minlength="6" required>
      <div class="row"><button class="btn" value="in">Anmelden</button><button class="btn light" value="up">Registrieren</button></div>
      <p class="msg" id="msg"></p>
      <button type="button" class="link" id="forgot">Passwort vergessen?</button>
    </form>`;
  $('forgot').onclick = () => forgotPassword($('email').value);
  $('loginForm').onsubmit = async e => {
    e.preventDefault();
    const msg = $('msg'); msg.className = 'msg'; msg.textContent = 'Einen Moment…';
    try {
      const info = e.submitter.value === 'up' ? await db.signUp($('email').value, $('pw').value) : await db.signIn($('email').value, $('pw').value);
      if (info) { msg.textContent = info; return; }
      renderAccount(); renderMenu();
    } catch (err) {
      msg.className = 'msg err';
      msg.textContent = err.message === 'Invalid login credentials' ? 'Benutzername oder Passwort falsch.' : err.message;
    }
  };
}

// Passwort vergessen: Anfrage an den Admin, der ein neues Passwort setzt
function forgotPassword(name = '') {
  dialog('Passwort vergessen?', `<p>Der Admin kann dir ein neues Passwort geben. Schick ihm eine Anfrage:</p>
    <input class="dlg-in" id="fName" type="text" placeholder="Dein Benutzername" value="${esc(name)}" autocapitalize="none" autocorrect="off" spellcheck="false">
    <input class="dlg-in" id="fNote" type="text" maxlength="300" placeholder="Wie erreicht dich der Admin?">`, [
    ['Anfrage senden', async () => {
      const n = $('fName').value.trim(), note = $('fNote').value.trim();
      if (!n) return toast('Bitte Benutzernamen eingeben');
      try {
        await db.requestPasswordReset(n, note);
        dialog('Anfrage gesendet', '<p>Der Admin setzt dir ein neues Passwort und gibt es dir weiter. Danach kannst du es unter Konto selbst ändern.</p>', [['OK', () => {}]]);
      } catch (e) { toast('Hat nicht geklappt'); console.warn(e); }
    }],
    ['Abbrechen', () => {}, true],
  ]);
}

const esc = v => String(v ?? '').replace(/[&<>"']/g, c => `&#${c.charCodeAt(0)};`);
const needLogin = (el, what = 'Die Rangliste') => {
  if (db.getUser()) return false;
  el.innerHTML = `<div class="form"><b>Bitte anmelden</b><p class="msg">${what} gibt es nur mit Konto.</p><button class="btn" id="goLogin">Zum Konto</button></div>`;
  $('goLogin').onclick = () => show('account');
  return true;
};

// ---------- Rangliste ----------
const RANKS = [['level', 'Level'], ['timed_highscore', 'Zeit-Rekord'], ['streak', 'Serie 🔥'], ['best_streak', 'Beste Serie'], ['words', 'Wörter'], ['games', 'Spiele']];
let rankBy = 'level', rankData = null;
async function renderRanking(reload) {
  const body = $('rankBody');
  $('rankTabs').innerHTML = RANKS.map(([k, l]) => `<button data-k="${k}" class="${k === rankBy ? 'on' : ''}">${l}</button>`).join('');
  $('rankTabs').querySelectorAll('button').forEach(b => b.onclick = () => { rankBy = b.dataset.k; renderRanking(); });
  if (needLogin(body)) return;
  if (!rankData || reload) {
    body.innerHTML = '<p class="msg">Lädt…</p>';
    await db.sync();
    try { rankData = await db.leaderboard(); } catch (e) { body.innerHTML = `<p class="msg err">Rangliste nicht erreichbar: ${esc(e.message)}</p>`; return; }
  }
  const me = db.getUser().id;
  const sorted = [...rankData].sort((a, b) => b[rankBy] - a[rankBy] || a.username.localeCompare(b.username));
  let pos = 0, last = null;
  body.innerHTML = sorted.map((r, i) => {
    if (r[rankBy] !== last) { pos = i + 1; last = r[rankBy]; }
    const medal = ['🥇', '🥈', '🥉'][pos - 1] ?? pos + '.';
    return `<div class="rank${r.id === me ? ' me' : ''}"><span class="pos">${medal}</span><span class="name">${esc(r.username)}</span><span class="val">${r[rankBy]}${rankBy === 'timed_highscore' && r.timed_size ? ` <small style="font-weight:600;opacity:.7">${r.timed_size}×${r.timed_size}</small>` : ''}</span></div>`;
  }).join('') || '<p class="msg">Noch keine Spieler.</p>';
}
$('rankReload').onclick = () => renderRanking(true);

// ---------- Admin ----------
let adminData = [];
async function renderAdmin() {
  const body = $('adminBody');
  if (!db.getProfile()?.is_admin) { body.innerHTML = '<p class="msg">Nur für Admins.</p>'; return; }
  body.innerHTML = '<p class="msg">Lädt…</p>';
  let reqs = [];
  try {
    [adminData, reqs] = await Promise.all([db.adminOverview(), db.adminPwRequests().catch(() => [])]);
  } catch (e) { body.innerHTML = `<p class="msg err">${esc(e.message)}</p>`; return; }
  const ago = d => d ? new Date(d).toLocaleDateString('de') : '–';
  const byId = Object.fromEntries(adminData.map(u => [u.id, u]));
  reqs = reqs.filter(r => byId[r.user_id]);
  body.innerHTML = (reqs.length ? `<h3 class="sec" style="margin-top:4px">🔑 Passwort-Anfragen</h3>` + reqs.map((r, i) => `
    <button class="urow" data-r="${i}"><b>${esc(byId[r.user_id].username)}</b><span class="badge red">neu</span>
      <small>${r.note ? esc(r.note) + ' · ' : ''}${ago(r.created_at)}</small></button>`).join('') + '<h3 class="sec">Konten</h3>' : '')
    + `<p class="msg" style="margin:0 4px 10px">${adminData.length} Konten · antippen zum Bearbeiten</p>` + adminData.map((u, i) => `
    <button class="urow" data-i="${i}"><b>${esc(u.username)}</b>${u.is_admin ? '<span class="badge">Admin</span>' : ''}${u.banned ? '<span class="badge red">Gesperrt</span>' : ''}
      <small>Level ${u.current_level} · Serie ${u.daily_streak} (beste ${u.best_streak}) · Zeit-Rekord ${u.timed_highscore}</small>
      <small>${u.games} Spiele · ${u.words} Wörter · seit ${ago(u.created_at)} · zuletzt ${ago(u.last_sign_in_at)}${u.email.endsWith('@wortsalat.invalid') ? '' : ' · ' + esc(u.email)}</small>
    </button>`).join('');
  body.querySelectorAll('[data-i]').forEach(b => b.onclick = () => editUser(adminData[b.dataset.i]));
  body.querySelectorAll('[data-r]').forEach(b => b.onclick = () => setPassword(byId[reqs[b.dataset.r].user_id], reqs[b.dataset.r]));
}

function setPassword(u, req) {
  dialog(`Passwort für ${u.username}`, `${req?.note ? `<p>Nachricht: „${esc(req.note)}“</p>` : ''}
    <p>Neues Passwort festlegen und dem Spieler weitergeben. Er kann es danach unter Konto selbst ändern.</p>
    <input class="dlg-in" id="setPw" type="text" minlength="6" placeholder="Neues Passwort (mind. 6 Zeichen)" autocapitalize="none" autocorrect="off" spellcheck="false">`, [
    ['Passwort setzen', async () => {
      const pw = $('setPw').value;
      try {
        await db.adminSetPassword(u.id, pw);
        dialog('Passwort gesetzt', `<p>Gib ${esc(u.username)} das neue Passwort weiter:</p><p style="font-size:20px;font-weight:800;-webkit-user-select:text;user-select:text">${esc(pw)}</p>`, [['OK', renderAdmin]]);
      } catch (e) { alert('Fehler: ' + e.message); }
    }],
    ...(req ? [['Anfrage löschen', async () => { try { await db.adminDropPwRequest(u.id); } catch (e) { alert('Fehler: ' + e.message); } renderAdmin(); }, true]] : []),
    ['Abbrechen', () => {}, true],
  ]);
}
$('adminReload').onclick = renderAdmin;

function editUser(u) {
  const self = u.id === db.getUser().id;
  const num = (k, l) => `<label>${l}<input type="number" min="0" id="e_${k}" value="${u[k]}"></label>`;
  const run = fn => async () => { try { if (await fn() !== false) toast('Erledigt'); } catch (e) { alert('Fehler: ' + e.message); } renderAdmin(); };
  dialog(u.username, `<div class="edit">
      <label class="full">Benutzername<input type="text" id="e_username" value="${esc(u.username)}" autocapitalize="none"></label>
      ${num('current_level', 'Level')}${num('timed_highscore', 'Zeit-Rekord')}${num('daily_streak', 'Serie')}${num('best_streak', 'Beste Serie')}
      <label class="check full"><input type="checkbox" id="e_admin" ${u.is_admin ? 'checked' : ''} ${self ? 'disabled' : ''}> Admin</label>
      <label class="check full"><input type="checkbox" id="e_banned" ${u.banned ? 'checked' : ''} ${self ? 'disabled' : ''}> Gesperrt (nicht in der Rangliste, speichert nichts mehr)</label>
    </div>`, [
    ['Speichern', run(() => {
      const name = $('e_username').value.trim();
      if (!db.USERNAME_RE.test(name)) throw new Error('Benutzername: 3–20 Zeichen, nur Buchstaben, Zahlen und _.');
      const n = k => Math.max(0, parseInt($('e_' + k).value, 10) || 0);
      return db.adminSaveUser(u.id,
        { username: name, is_admin: self ? true : $('e_admin').checked, banned: self ? false : $('e_banned').checked },
        { current_level: Math.max(1, n('current_level')), timed_highscore: n('timed_highscore'), daily_streak: n('daily_streak'), best_streak: n('best_streak') });
    })],
    ['Passwort setzen', () => setPassword(u), true],
    ['Spielverlauf löschen', run(() => confirm(`Alle ${u.games} Spiele von ${u.username} löschen?`) && db.adminClearGames(u.id)), true],
    ...(self ? [] : [['Konto löschen', run(() => confirm(`Konto ${u.username} endgültig löschen? Das kann nicht rückgängig gemacht werden.`) && db.adminDeleteUser(u.id)), true]]),
    ['Abbrechen', () => {}, true],
  ]);
}

// ---------- Mitteilungen ----------
const pushSupported = () => 'serviceWorker' in navigator && 'PushManager' in window && 'Notification' in window;
const isIOS = /iPhone|iPad|iPod/.test(navigator.userAgent);
const urlKey = k => Uint8Array.from(atob(k.replace(/-/g, '+').replace(/_/g, '/')), c => c.charCodeAt(0));
const allOn = () => Object.fromEntries(KINDS.map(([k]) => [k, true]));

async function renderNotify() {
  const body = $('notifyBody');
  const box = html => body.innerHTML = `<div class="form">${html}</div>`;
  if (needLogin(body, 'Mitteilungen')) return;
  if (!pushSupported()) {
    return box(isIOS && !navigator.standalone
      ? '<b>Erst zum Home-Bildschirm hinzufügen</b><p class="msg">Auf dem iPhone gehen Mitteilungen nur in der App: In Safari auf Teilen → „Zum Home-Bildschirm“ tippen, Wortsalat von dort öffnen und hier einschalten (ab iOS 16.4).</p>'
      : '<b>Nicht unterstützt</b><p class="msg">Dieser Browser kann keine Mitteilungen empfangen.</p>');
  }
  if (Notification.permission === 'denied') {
    return box('<b>Mitteilungen blockiert</b><p class="msg">Erlaube sie in den Einstellungen deines Geräts (iPhone: Einstellungen → Mitteilungen → Wortsalat) und öffne diese Seite erneut.</p>');
  }
  const sub = await db.pushSubscription();
  if (!sub) {
    box(`<b>🔔 Verpasse keinen Tag</b><p class="msg">Wir erinnern dich ans Tagesrätsel und bevor deine Serie verfällt. Höchstens ein paar Mal am Tag, alles einzeln abschaltbar.</p>
      <button class="btn" id="pushOn">Mitteilungen einschalten</button><p class="msg" id="pushMsg"></p>`);
    $('pushOn').onclick = async () => {
      $('pushMsg').textContent = 'Einen Moment…';
      try {
        if (await Notification.requestPermission() !== 'granted') return renderNotify();
        const reg = await navigator.serviceWorker.ready;
        const s = await reg.pushManager.subscribe({ userVisibleOnly: true, applicationServerKey: urlKey(VAPID_PUBLIC) });
        await db.savePush(s, allOn());
        toast('Mitteilungen an 🔔');
        renderNotify();
      } catch (e) {
        $('pushMsg').className = 'msg err'; $('pushMsg').textContent = 'Hat nicht geklappt: ' + e.message;
      }
    };
    return;
  }
  let prefs = { ...allOn(), ...(await db.pushPrefs(sub.endpoint).catch(() => null)) };
  body.innerHTML = KINDS.map(([k, title, when]) => `<label class="switch"><div>${title}<small>${when}</small></div><input type="checkbox" data-k="${k}" ${prefs[k] ? 'checked' : ''}></label>`).join('')
    + `<button class="btn light" id="pushOff" style="margin-top:16px;width:100%">Alle Mitteilungen ausschalten</button>`;
  body.querySelectorAll('[data-k]').forEach(c => c.onchange = async () => {
    prefs = { ...prefs, [c.dataset.k]: c.checked };
    try { await db.savePush(sub, prefs); } catch (e) { toast('Nicht gespeichert'); c.checked = !c.checked; }
  });
  $('pushOff').onclick = async () => {
    try { await db.deletePush(sub.endpoint); await sub.unsubscribe(); toast('Mitteilungen aus'); } catch (e) { toast('Hat nicht geklappt'); }
    renderNotify();
  };
}
// Tipp auf eine Mitteilung öffnet das Tagesrätsel
navigator.serviceWorker?.addEventListener('message', e => { if (e.data?.start === 'tag') { if (g) persist(); start('tag'); } });

// ---------- Design ----------
$('themeBtn').onclick = () => {
  const set = t => { try { t ? localStorage.setItem('ws_theme', t) : localStorage.removeItem('ws_theme'); } catch {} applyTheme(); };
  let cur = null; try { cur = localStorage.getItem('ws_theme'); } catch {}
  const mark = t => (cur === t ? '✓ ' : '');
  dialog('Design', '<p>Wie soll Wortsalat aussehen?</p>', [
    [mark('light') + '☀️ Hell', () => set('light'), cur !== 'light'],
    [mark('dark') + '🌙 Dunkel', () => set('dark'), cur !== 'dark'],
    [mark(null) + '📱 Wie das Gerät', () => set(null), cur !== null],
  ]);
};

// ---------- Haustiere ----------
const SOON_EMOJI = { hund: '🐶', kuh: '🐮', hase: '🐰' };
const myPet = () => { try { return localStorage.getItem('ws_pet') || 'none'; } catch { return 'none'; } };
function renderPets() {
  const cur = myPet();
  $('petGrid').innerHTML = PETS.map(p => `<button class="petcard${p.id === cur ? ' on' : ''}" data-pet="${p.id}" ${p.soon ? 'disabled' : ''}>
      ${p.soon ? `<span class="soon">${SOON_EMOJI[p.id] ?? '🐾'}</span>` : p.svg}${p.name}<small>${p.art ? p.art + ' · ' : ''}${p.soon ? 'kommt bald' : p.id === cur ? 'ausgewählt' : 'auswählen'}</small></button>`).join('')
    + `<button class="petcard${cur === 'none' ? ' on' : ''}" data-pet="none"><span class="soon">🚫</span>Kein Haustier<small>${cur === 'none' ? 'ausgewählt' : 'auswählen'}</small></button>`;
  $('petGrid').querySelectorAll('[data-pet]:not(:disabled)').forEach(b => b.onclick = () => {
    try { localStorage.setItem('ws_pet', b.dataset.pet); } catch {}
    showPet(b.dataset.pet);
    renderPets();
  });
}
showPet(myPet());

// ---------- Start ----------
renderMenu();
// Beim allerersten Start einmal das Tutorial zeigen
if (new URLSearchParams(location.search).get('start') === 'tag') { history.replaceState(null, '', location.pathname); start('tag'); }
else try { if (!localStorage.getItem('ws_tutorial')) { localStorage.setItem('ws_tutorial', '1'); start('tutorial'); } } catch {}
db.init().then(renderMenu).catch(e => console.warn('Konto nicht erreichbar', e));
if ('serviceWorker' in navigator && location.protocol === 'https:') navigator.serviceWorker.register('sw.js');
</script>
</body>
</html>
