name: Mitteilungen
on:
  schedule:
    - cron: '5 6-22 * * *' # stündlich, 7–23 Uhr deutsche Zeit
  workflow_dispatch:
jobs:
  send:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm i --no-save web-push@3.6.7
      - run: node push/send.mjs
        env:
          PUSH_KEY: ${{ secrets.PUSH_KEY }}
          VAPID_PRIVATE: ${{ secrets.VAPID_PRIVATE }}
